<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f8a4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="적정가">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>오늘 이 가격 괜찮을까? – 농수산물 적정가 확인</title>
</head>
<body>
<header class="top">
  <div class="bar-top">
    <h1>🛒 이 가격, 괜찮을까?</h1>
    <div class="tools">
      <button id="size" class="tool" type="button" aria-label="글씨 크게 보기">가+</button>
      <a class="tool" href="help.html" aria-label="사용 설명서">?</a>
    </div>
  </div>
  <p id="meta" class="meta">시세 불러오는 중…</p>
</header>

<main>
  <!-- 1단계 -->
  <section class="step" id="s1">
    <h2><span class="num">1</span> 무엇을 사세요?</h2>

    <div id="pickedBox" hidden>
      <div class="picked"><span id="pEmoji" class="em-big"></span><b id="pName"></b>
        <button id="change" class="btn-sub" type="button">다시 고르기</button></div>
      <div id="variants" class="chips wrap"></div>
    </div>

    <div id="chooser">
      <label class="camera" for="shot"><span>📷</span><b>가격표 사진 찍기</b><small>사진을 찍으면 자동으로 채워줘요</small></label>
      <input id="shot" type="file" accept="image/*" capture="environment" hidden>
      <div id="ocr" hidden></div>

      <label class="lbl" for="q">또는 이름으로 찾기</label>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="예) 양파, 사과, 고등어" enterkeyhint="search">
      <div id="cats" class="tiles" role="tablist" aria-label="분류"></div>
      <h3 id="gridTitle" class="gtitle">자주 찾는 품목</h3>
      <div id="grid" class="grid"></div>
    </div>
  </section>

  <!-- 2단계 -->
  <section class="step" id="s2" hidden>
    <h2><span class="num">2</span> 얼마예요?</h2>
    <label class="lbl" for="price">파는 가격</label>
    <div class="money"><input id="price" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="가격(원)"><span>원</span></div>

    <p class="lbl">얼마만큼 주나요?</p>
    <div id="presets" class="chips wrap"></div>
    <details class="custom"><summary>직접 입력하기</summary>
      <div class="row">
        <input id="qty" type="number" inputmode="decimal" min="0" step="any" value="1" aria-label="수량">
        <select id="unit" aria-label="단위"></select>
      </div>
    </details>

    <p class="lbl">어디서 사세요?</p>
    <div id="venues" class="chips wrap"></div>
  </section>

  <!-- 3단계 -->
  <section class="step" id="s3" hidden aria-live="polite">
    <h2><span class="num">3</span> 결과</h2>
    <div id="result"></div>
  </section>

  <p class="foot">
    시세 출처: 공공데이터포털 한국농수산식품유통공사(도·소매가격, 공영도매시장 경매)<br>
    전국 평균이라 품질·지역·시간에 따라 다를 수 있어요. 참고용으로 봐주세요.
  </p>
  <a class="manual" href="help.html">📖 사용 설명서 보기</a>
  <button id="install" class="btn-main" hidden type="button">📲 홈 화면에 추가하기</button>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
