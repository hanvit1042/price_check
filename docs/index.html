<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f8a4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="적정가">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>적정가 판독기 – 농수산물 시세 비교</title>
</head>
<body>
<header class="top">
  <h1>🛒 적정가 판독기</h1>
  <p id="meta" class="meta">데이터 불러오는 중…</p>
</header>

<main>
  <section class="card">
    <label class="lbl" for="q">품목 검색</label>
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="예) 양파, 사과, 고등어" enterkeyhint="search">
    <div id="cats" class="chips" role="tablist" aria-label="분류"></div>
    <ul id="list" class="list" role="listbox"></ul>
  </section>

  <section class="card scan">
    <label class="scanbtn" for="shot">📷 가격표 촬영해서 자동 입력</label>
    <input id="shot" type="file" accept="image/*" capture="environment" hidden>
    <p class="hint">가격표를 정면에서 밝게 찍어주세요. 인식 결과는 꼭 확인하세요.</p>
    <div id="ocr" hidden></div>
  </section>

  <section id="form" class="card" hidden>
    <div class="sel"><b id="selName"></b><button id="change" class="link" type="button">품목 변경</button></div>
    <div class="row">
      <div class="col grow">
        <label class="lbl" for="price">판매 가격(원)</label>
        <input id="price" type="number" inputmode="numeric" min="0" placeholder="예) 5000">
      </div>
    </div>
    <div class="row">
      <div class="col grow">
        <label class="lbl" for="qty">수량</label>
        <input id="qty" type="number" inputmode="decimal" min="0" step="any" value="1">
      </div>
      <div class="col">
        <label class="lbl" for="unit">단위</label>
        <select id="unit"></select>
      </div>
    </div>
    <label class="lbl" for="venue">구매처</label>
    <select id="venue"></select>
  </section>

  <section id="result" class="card result" hidden aria-live="polite"></section>
  <section id="trend" class="card" hidden></section>

  <p class="foot">
    출처: 한국농수산식품유통공사 KAMIS · 공공데이터포털 전국 공영도매시장 실시간 경매정보.<br>
    소매가는 전국 평균이며 품질(등급)·지역·시간에 따라 차이가 있습니다. 참고용 정보입니다.
  </p>
  <button id="install" class="install" hidden type="button">📲 홈 화면에 추가</button>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
