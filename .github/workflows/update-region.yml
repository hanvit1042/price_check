name: update-region
on:
  schedule:
    - cron: '41 21 * * *'   # 매일 06:41 KST — 지역별 소매가(조사는 하루 단위)
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-region
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 지역별 시세 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-region.mjs
      - name: 변경분 커밋
        run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add docs/data/region.json docs/data/channel.json
          git diff --cached --quiet || (git commit -m "data: update region prices" && for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done)
